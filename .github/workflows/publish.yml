# PyPI Trusted Publishing setup:
# This workflow publishes to PyPI using Trusted Publishing (OpenID Connect).
# Before first publish, configure a Trusted Publisher in PyPI project settings:
# Owner: s13rw81
# Repository name: post-on-telegram
# Workflow name: publish.yml
# Environment: pypi
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/post-on-telegram
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata with twine
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
